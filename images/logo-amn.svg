<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 100" fill="none" role="img" aria-label="AMN">
  <!--
    La marque AMN, redessinée au trait.

    Pourquoi des traits et non du texte : les lettres sont des monolinéaires
    parfaitement droites, à sommets pointus, dans une graisse que le dépôt
    n'embarque pas (Inter s'arrête à 400). Un `<text>` aurait rendu une autre
    lettre sur toute machine où la fonte manque — c'est-à-dire chez la cliente.
    Tracées, elles sont les mêmes partout, à toute taille, sans fonte.

    Le dégradé DESCEND — blanc en haut, gris en bas — comme sur le fichier
    fourni, et non de gauche à droite comme l'ancien sigle.
  -->
  <defs>
    <linearGradient id="amnStroke" x1="0" y1="8" x2="0" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#c4c4c2" />
      <stop offset="1" stop-color="#6b6b69" />
    </linearGradient>
  </defs>
  <g stroke="url(#amnStroke)" stroke-width="3.2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="12">
    <!-- A -->
    <path d="M0 90 L42 10 L84 90" />
    <path d="M11.6 68 L72.4 68" />
    <!-- M : fûts verticaux, V central jusqu'à la ligne de pied -->
    <path d="M98 90 L98 10 L140 90 L182 10 L182 90" />
    <!-- N -->
    <path d="M190 90 L190 10 L274 90 L274 10" />
  </g>
</svg>
