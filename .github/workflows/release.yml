name: Release

# Builds the Windows installer and publishes it to GitHub Releases, which is
# what update.electronjs.org (and therefore the in-app auto-updater) reads.
#
# Trigger: push a version tag matching the package.json version, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
#
# No local Windows machine or manual `npm run publish` needed — this runs the
# whole "bump version → tag → push" flow to a public Release automatically.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ─────────────────────────────────────────────────────────────────────
      # Construire, VÉRIFIER, puis seulement téléverser.
      #
      # `npm run publish` faisait les deux d'un coup : la CI a donc publié trois
      # installeurs qui ne démarraient pas, sans que rien puisse s'y opposer.
      # Le découpage ci-dessous vérifie EXACTEMENT les artefacts qui seront
      # ensuite envoyés — `--from-dry-run` réutilise ceux de l'étape de
      # construction au lieu d'en refabriquer d'autres.
      #
      # Les deux hooks de `forge.config.ts` (postPackage, postMake) bloquent
      # déjà un artefact incomplet pendant la construction. Ces étapes-ci sont
      # explicites en plus, pour que le journal de la CI montre noir sur blanc
      # ce qui a été contrôlé.
      #
      # Repli si `--from-dry-run` posait problème : `npm run publish` reste
      # valable et garde les deux hooks — on perd la garantie « on téléverse
      # exactement ce qu'on a vérifié », pas le garde-fou lui-même.
      - name: Bootstrap (rebuild des modules natifs)
        run: npm run bootstrap

      - name: Build (sans téléversement)
        run: npx electron-forge publish --dry-run
        env:
          AMN_API_URL: ${{ secrets.AMN_API_URL }}
          AMN_API_OPERATOR_TOKEN: ${{ secrets.AMN_API_OPERATOR_TOKEN }}

      - name: Vérifier le paquet construit (moteur Electron complet)
        run: npm run check:package

      - name: Vérifier l'installeur (ce qui part vraiment chez la cliente)
        run: npm run check:installer

      - name: Publier les artefacts vérifiés
        run: npx electron-forge publish --from-dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the app at build time (see vite.main.config.ts) so the
          # packaged binary talks to amn-api and the sync WebSocket connects.
          # Set these two repository secrets in GitHub → Settings → Secrets and
          # variables → Actions. AMN_API_OPERATOR_TOKEN MUST equal the
          # OPERATOR_TOKEN env var configured on the amn-api server (Render).
          AMN_API_URL: ${{ secrets.AMN_API_URL }}
          AMN_API_OPERATOR_TOKEN: ${{ secrets.AMN_API_OPERATOR_TOKEN }}
