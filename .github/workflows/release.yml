name: Release

# Construit l'installeur Windows (NSIS, electron-builder), PROUVE qu'il
# démarre, puis le publie dans les Releases GitHub — que lit electron-updater
# dans l'application installée (édition interne uniquement).
#
# Déclenchement : pousser un tag correspondant à la version du package.json :
#   git tag v1.0.1 && git push origin v1.0.1
#
# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI CE WORKFLOW EXIGE UN DÉMARRAGE RÉEL
#
# Quatre versions publiées d'affilée (v1.2.35 → v1.2.38) s'installaient sans
# erreur et mouraient au lancement. L'autopsie des artefacts publiés a montré
# des fichiers moteur identiques à l'octet près à l'Electron officiel : les
# contrôles de contenu étaient verts, et ils disaient vrai — la panne vivait
# dans la mécanique d'installation Squirrel, le seul maillon qu'aucune
# vérification de fichiers ne peut voir.
#
# La leçon est câblée ici : la publication n'a lieu que si l'exécutable — 
# celui du paquet construit ET celui réellement installé par l'installeur
# final — a littéralement démarré sur le runner Windows (`--smoke-test`,
# voir src/main.ts). Une CI verte signifie désormais « l'application s'est
# ouverte », pas « les fichiers avaient l'air bons ».
#
# La publication téléverse EXACTEMENT les fichiers vérifiés, via l'API GitHub —
# aucune reconstruction entre la vérification et l'envoi.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (bundles Vite, édition interne)
        run: node scripts/build-desktop.mjs
        env:
          # Cuits dans le bundle principal à la construction (vite.main.config.ts)
          # pour que le binaire installé parle à amn-api. AMN_API_OPERATOR_TOKEN
          # doit égaler l'OPERATOR_TOKEN configuré sur amn-api (Render).
          AMN_API_URL: ${{ secrets.AMN_API_URL }}
          AMN_API_OPERATOR_TOKEN: ${{ secrets.AMN_API_OPERATOR_TOKEN }}

      # ─────────────────────── Signature de code (BLOC 2) ────────────────────
      # Le certificat est OPTIONNEL aujourd'hui — Aaron ne l'a pas encore —
      # mais sa configuration ne doit jamais être à moitié faite.
      #
      # Mesuré dans app-builder-lib 26.15.3, pas supposé : quand `CSC_LINK` est
      # vide, `windowsSignToolManager.getCscInfo()` rend `null` et la
      # construction CONTINUE sans signer, sans erreur. Un secret mal nommé
      # publierait donc un binaire nu sous une CI verte. Cette étape refuse
      # cette situation AVANT l'empaquetage, et dit clairement l'autre cas.
      - name: État de la signature de code
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $aCert = -not [string]::IsNullOrWhiteSpace($env:CERT)
          $aPass = -not [string]::IsNullOrWhiteSpace($env:PASS)
          if ($aCert -and -not $aPass) {
            Write-Error "WINDOWS_CERT_PFX_BASE64 est defini mais WINDOWS_CERT_PASSWORD manque : electron-builder tenterait d'ouvrir le .pfx avec un mot de passe vide."
            exit 1
          }
          if ($aPass -and -not $aCert) {
            Write-Error "WINDOWS_CERT_PASSWORD est defini mais WINDOWS_CERT_PFX_BASE64 manque : la construction ne signerait rien, en silence."
            exit 1
          }
          if ($aCert) {
            Write-Host "certificat present — la construction DOIT signer (forceCodeSigning actif)."
          } else {
            Write-Warning "AUCUN certificat configure : les artefacts de cette publication seront NON SIGNES. Windows SmartScreen affichera un avertissement a l'installation. Voir docs/SIGNATURE-CODE.md."
          }

      - name: Empaqueter (NSIS, sans publication)
        run: npx electron-builder --config electron-builder.config.mjs --win --x64 --publish never
        env:
          # Les deux noms lus par app-builder-lib. Vides = build non signe,
          # et `forceCodeSigning` reste faux ; renseignes = signature exigee.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      # La configuration ne prouve rien : on INTERROGE les fichiers produits.
      # Le meme motif que le smoke test — on ne croit pas l'outil sur parole.
      - name: Vérifier la signature des artefacts
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $ident = node --input-type=module -e "import c from './electron-builder.config.mjs'; console.log(c.productName);"
          $cibles = @(
            "dist-app\win-unpacked\$ident.exe",
            (Get-ChildItem "dist-app\*Setup*.exe" | Select-Object -First 1).FullName
          )
          $attenduSigne = -not [string]::IsNullOrWhiteSpace($env:CERT)
          foreach ($c in $cibles) {
            if (-not (Test-Path $c)) { Write-Error "artefact introuvable : $c"; exit 1 }
            $sig = Get-AuthenticodeSignature $c
            Write-Host "$([System.IO.Path]::GetFileName($c)) : $($sig.Status)"
            if ($attenduSigne) {
              if ($sig.Status -ne 'Valid') { Write-Error "signature invalide ($($sig.Status)) sur $c"; exit 1 }
              # L'horodatage est ce qui fait survivre la signature a
              # l'expiration du certificat. Sans lui, tout se met a alerter le
              # meme jour, y compris les installeurs deja distribues.
              if (-not $sig.TimeStamperCertificate) { Write-Error "signature NON HORODATEE sur $c : elle expirera avec le certificat."; exit 1 }
              Write-Host "  signe par   : $($sig.SignerCertificate.Subject)"
              Write-Host "  horodate par: $($sig.TimeStamperCertificate.Subject)"
            } elseif ($sig.Status -eq 'Valid') {
              Write-Error "artefact signe alors qu'aucun certificat n'est configure : verifier d'ou vient cette signature."
              exit 1
            }
          }

      # ───────────────────────── Vérifications, avant tout envoi ─────────────
      # 1. Intégrité : chaque fichier du moteur Electron du paquet est comparé
      #    par SHA-256 à node_modules/electron/dist (même version, même
      #    plateforme, sur ce runner). Tout écart = échec.
      - name: Intégrité du moteur (SHA-256 contre le dist Electron)
        run: npm run check:package -- --dir "dist-app/win-unpacked"

      # 2. Démarrage réel du paquet construit : l'exécutable doit atteindre
      #    whenReady et sortir avec le code 0. C'est la préuve qu'ICU, V8 et
      #    tout le moteur s'initialisent — la classe de pannes qui a frappé.
      - name: Smoke test — l'exécutable construit démarre
        shell: pwsh
        run: |
          # Le nom de l'exe suit productName, qui change d'une édition à l'autre.
          $nom = node --input-type=module -e "import c from './electron-builder.config.mjs'; console.log(c.productName);"
          $p = Start-Process -FilePath "dist-app\win-unpacked\$nom.exe" -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "smoke test : délai dépassé (60 s)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "smoke test : code de sortie $($p.ExitCode)"; exit 1 }
          Write-Host "smoke test OK — l'exécutable construit a démarré et s'est arrêté proprement."

      # 3. Le test définitif : installer l'INSTALLEUR FINAL en silencieux, puis
      #    démarrer l'application INSTALLÉE. C'est le chemin exact d'une
      #    utilisatrice — l'étape que les quatre versions cassées auraient
      #    toutes échouée.
      - name: Smoke test — l'application INSTALLÉE démarre
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist-app\*Setup*.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "installeur introuvable dans dist-app/"; exit 1 }
          Write-Host "installation silencieuse de $($setup.Name)…"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru
          if (-not $i.WaitForExit(180000)) { $i.Kill(); Write-Error "installation : délai dépassé"; exit 1 }
          if ($i.ExitCode -ne 0) { Write-Error "installation : code $($i.ExitCode)"; exit 1 }

          <#
            LE DOSSIER D'INSTALLATION N'EST PAS « <nom de produit> ».

            Confirmé en exécutant la fonction réelle d'electron-builder
            (getWindowsInstallationDirName, app-builder-lib/out/targets/
            targetUtil.js) avec nos quatre combinaisons oneClick/perMachine :
            SEULE la nôtre (oneClick: true, perMachine: false — un installeur
            un clic, par utilisateur) rend un nom de dossier différent du nom
            de produit. Dans ce cas précis, electron-builder nomme le dossier
            d'après le champ "name" de package.json ("amn-desktop"), jamais
            "productName" ("AMN Desktop") — voir NsisTarget.js :
            APP_FILENAME = getWindowsInstallationDirName(appInfo, !oneClick || isPerMachine).
            Avec nos valeurs, cette condition vaut FALSE, donc le nom retenu
            est TOUJOURS appInfo.sanitizedName, quel que soit productName.

            Ce n'est pas un problème de minutage : l'extraction NSIS
            (Nsis7z::Extract, CopyFiles /SILENT) s'exécute dans LE MÊME
            processus que celui attendu par WaitForExit — rien dans les
            gabarits NSIS ne détache la copie de fichiers dans un processus
            enfant pour une installation par utilisateur sans élévation. Le
            code de sortie 0 sans dépassement de délai le confirme déjà :
            l'installation avait réellement terminé, au bon endroit — juste
            pas celui que ce script devinait.

            On calcule donc le nom réel comme electron-builder le calcule,
            plutôt que de le deviner une seconde fois.
          #>
          <#
            Le nom du dossier ET celui de l'exe sont LUS DANS LA CONFIGURATION
            d'electron-builder, jamais devinés une seconde fois.

            Deux raisons, et la seconde est arrivée au Bloc 1. La première :
            avec oneClick+perUser, NSIS nomme le dossier d'après le champ `name`
            de package.json, pas d'après productName. La seconde : ce champ est
            désormais RÉÉCRIT par édition via `extraMetadata.name`, parce que
            les deux éditions partagent un dépôt et s'installaient donc dans le
            même dossier — l'une écrasant l'autre. Lire package.json ici
            donnerait maintenant la mauvaise réponse.
          #>
          $ident = node --input-type=module -e "import c from './electron-builder.config.mjs'; console.log(JSON.stringify({ dir: c.extraMetadata.name, exe: c.productName }));" | ConvertFrom-Json
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\$($ident.dir)"
          $exe = Join-Path $installDir "$($ident.exe).exe"
          Write-Host "installation attendue dans : $installDir"
          Write-Host "exécutable attendu         : $exe"

          # Filet de sécurité, pas le correctif : un antivirus qui verrouille
          # encore le fichier juste après l'écriture reste un cas réel sur les
          # runners Windows. On attend sa présence jusqu'à 60 s plutôt que de
          # se fier à un seul Test-Path immédiat.
          $found = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (Test-Path $exe) { $found = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $found) {
            Write-Error "exécutable installé introuvable après 60 s : $exe"
            $programsDir = Join-Path $env:LOCALAPPDATA "Programs"
            if (Test-Path $programsDir) {
              Write-Host "contenu de $programsDir :"
              Get-ChildItem $programsDir | ForEach-Object { Write-Host "  $($_.Name)" }
            }
            exit 1
          }

          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "smoke test installé : délai dépassé"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "smoke test installé : code $($p.ExitCode)"; exit 1 }
          Write-Host "smoke test OK — l'application INSTALLÉE ($installDir) a démarré. Publication autorisée."

      # ───────────────────────────── Publication ─────────────────────────────
      # `gh release upload` envoie les fichiers DÉJÀ vérifiés ci-dessus —
      # l'installeur, latest.yml (le flux qu'electron-updater lit) et le
      # blockmap (les mises à jour différentielles).
      - name: Publier les artefacts vérifiés
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${env:GITHUB_REF}" -replace "refs/tags/", ""
          gh release create $tag --title $tag --notes "Publication automatique — installeur vérifié (intégrité SHA-256 + démarrage réel sur le runner)." 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "release $tag existe déjà — on téléverse dedans." }
          $assets = Get-ChildItem "dist-app" -File | Where-Object { $_.Name -match "Setup.*\.exe$|\.blockmap$|^latest\.yml$" }
          if (-not ($assets | Where-Object { $_.Name -eq "latest.yml" })) { Write-Error "latest.yml manquant — electron-updater ne verrait jamais cette version."; exit 1 }
          foreach ($a in $assets) { Write-Host "téléversement de $($a.Name)"; gh release upload $tag $a.FullName --clobber; if ($LASTEXITCODE -ne 0) { exit 1 } }
