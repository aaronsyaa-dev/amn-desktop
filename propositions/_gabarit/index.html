<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gabarit — AMN Desktop (maquette)</title>
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="stylesheet" href="../_lib/fonts/spectral.css">
<link rel="stylesheet" href="../_lib/fonts/space-grotesk.css">
<style>
  :root { --bg:#0a0a0a; --ink:#f2f2f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  main { position:relative; z-index:1; padding:40vh 16px 20vh; }
  h1 { font-family:'Spectral',Georgia,serif; font-weight:600; font-size:clamp(40px,9vw,120px); line-height:.95; }
</style>
<!-- La carte d'import est un script INLINE : la politique de sécurité du site
     l'autorise ('unsafe-inline'). Tout est servi par le site lui-même. -->
<script type="importmap">
{ "imports": {
    "three": "../_lib/three/three.module.js",
    "three/addons/": "../_lib/three/addons/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main><h1>Votre activité dans un seul outil.</h1></main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 0.05, 0.45);

let modele = null;
new GLTFLoader().load('../_lib/modeles/MaterialsVariantsShoe/MaterialsVariantsShoe.gltf', (g) => {
  modele = g.scene; scene.add(modele);
  const b = new THREE.Box3().setFromObject(modele); const c = b.getCenter(new THREE.Vector3());
  modele.position.sub(c);
  rendre();
});

function rendre() { renderer.render(scene, camera); }
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); rendre();
});
// Mouvement réduit : une seule image, pas de boucle.
if (!reduit) renderer.setAnimationLoop((t) => { if (modele) modele.rotation.y = t / 2000; rendre(); });
</script>
</body>
</html>
